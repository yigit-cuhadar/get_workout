name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version used locally; upgrade deliberately.
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib tool $([ -d test ] && echo test)
      - run: flutter analyze
      - name: Validate content
        run: dart run tool/validate_content.dart
      - name: Test
        run: |
          if find test -name '*_test.dart' 2>/dev/null | grep -q .; then flutter test; fi
      # CI runs in UTC, where daylight saving never shifts a week or a date.
      - name: Test cardio weeks, program schedules and steps across DST
        run: |
          for tz in Europe/Berlin America/New_York; do
            TZ=$tz flutter test test/features/cardio/cardio_domain_test.dart test/features/programs/program_schedule_test.dart test/features/steps
          done

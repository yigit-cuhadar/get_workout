include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - third_party/**
    - widgetbook/**
    # Flutter's gen-l10n still emits the deprecated flutter_localizations
    # delegates under 3.50.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    unawaited_futures: true
    avoid_print: true
    prefer_relative_imports: true
